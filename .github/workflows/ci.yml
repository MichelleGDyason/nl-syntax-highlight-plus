name: Obsidian plugin checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Run Community scanner checks
        uses: obsidianmd/obsidian-workflows@v1
        with:
          scanner-lint: "true"
          strict: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
