name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Validate, build, attest, and create draft release
        uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
          strict: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
